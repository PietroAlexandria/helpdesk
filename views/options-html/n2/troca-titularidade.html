<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troca de Titularidade — CedNet N2</title>
    <link rel="icon" href="/images/LogoCedNet.ico">
    <link rel="stylesheet" href="/css/sem-conexao.css">
    <link rel="stylesheet" href="/css/sharedCss/darkMode.css">
    <link rel="stylesheet" href="/css/sharedCss/historicoCard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <button id="btn-dark-mode" class="btn-dark-mode" onclick="toggleDarkMode()" title="Alternar tema" aria-label="Alternar tema">🌙</button>
    <div class="layout-with-history">
        <div class="container">

            <div class="page-header">
                <a href="/nivel2" class="btn-back">← Voltar</a>
                <h1 class="page-title">🔄 Troca de Titularidade</h1>
            </div>

            <!-- Tipo de Conexão -->
            <div class="card">
                <p class="card-title">Tipo de Conexão</p>
                <div class="field">
                    <label class="field-subtitle">Selecione o tipo</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="tipo-conexao" value="Fibra" onchange="toggleCards(this.value, { Fibra: 'card-fibra', Radio: 'card-radio' })"><span>Fibra</span></label>
                        <label class="radio-btn"><input type="radio" name="tipo-conexao" value="Radio" onchange="toggleCards(this.value, { Fibra: 'card-fibra', Radio: 'card-radio' })"><span>Rádio</span></label>
                    </div>
                </div>
            </div>

            <!-- Card Fibra -->
            <div class="card" id="card-fibra" style="display:none">
                <p class="card-title">Troca de Titularidade — Fibra</p>

                <div class="field">
                    <label for="nome-antigo">Nome Titular Antigo</label>
                    <input type="text" id="nome-antigo" name="nome-antigo">
                    <label for="os-antiga">O.S. Antiga</label>
                    <input type="text" id="os-antiga" name="os-antiga">
                    <label for="contrato-antigo">Contrato Antigo</label>
                    <input type="text" id="contrato-antigo" name="contrato-antigo">
                </div>

                <div class="field">
                    <label for="nome-novo">Nome Titular Novo</label>
                    <input type="text" id="nome-novo" name="nome-novo">
                    <label for="os-nova">O.S. Nova</label>
                    <input type="text" id="os-nova" name="os-nova">
                    <label for="contrato-novo">Contrato Novo</label>
                    <input type="text" id="contrato-novo" name="contrato-novo">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="endereco-fibra">Endereço</label>
                    <input type="text" id="endereco-fibra" name="endereco-fibra">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="pppoe-antigo-fibra">Usuário PPPoE Antigo</label>
                    <input type="text" id="pppoe-antigo-fibra" name="pppoe-antigo-fibra">
                    <label for="pppoe-senha-fibra">Senha PPPoE</label>
                    <input type="text" id="pppoe-senha-fibra" name="pppoe-senha-fibra">
                    <label for="id-login-fibra">ID Login Novo</label>
                    <input type="text" id="id-login-fibra" name="id-login-fibra">
                </div>

                <div class="field">
                    <label class="field-subtitle">Tipo de IP</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="tipo-ip-fibra" value="NAT"  onchange="toggleIpFibra(this.value)"><span>NAT</span></label>
                        <label class="radio-btn"><input type="radio" name="tipo-ip-fibra" value="FIXO" onchange="toggleIpFibra(this.value)"><span>IP Fixo</span></label>
                    </div>
                </div>
                <div class="field">
                    <label for="ip-fibra">IP <span style="font-weight:400;color:#64748b">(Opcional se NAT)</span></label>
                    <input type="text" id="ip-fibra" name="ip-fibra">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="olt">OLT</label>
                    <input type="text" id="olt" name="olt">
                    <label for="pon">PON</label>
                    <input type="text" id="pon" name="pon">
                    <label for="caixa">CAIXA</label>
                    <input type="text" id="caixa" name="caixa">
                    <label for="mac-onu">MAC ONU</label>
                    <input type="text" id="mac-onu" name="mac-onu">
                    <label for="serial-onu">Serial ONU</label>
                    <input type="text" id="serial-onu" name="serial-onu">
                </div>

                <hr class="sep">

                <div class="field">
                    <label class="field-subtitle">Modo de Operação</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="modo-fibra" value="Service" onchange="toggleModoFibra(this.value)"><span>Service (ONT)</span></label>
                        <label class="radio-btn"><input type="radio" name="modo-fibra" value="Bridge"  onchange="toggleModoFibra(this.value)"><span>Bridge (ONU + Roteador)</span></label>
                    </div>
                </div>

                <!-- Campos extras Bridge -->
                <div id="campos-bridge" style="display:none">
                    <div class="field">
                        <label for="modelo-onu">Modelo ONU/ONT</label>
                        <input type="text" id="modelo-onu" name="modelo-onu">
                        <label for="serial-roteador">Serial Number Roteador</label>
                        <input type="text" id="serial-roteador" name="serial-roteador">
                    </div>
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="mac-roteador-fibra">MAC Roteador</label>
                    <input type="text" id="mac-roteador-fibra" name="mac-roteador-fibra">
                    <label for="modelo-roteador-fibra">Modelo Roteador</label>
                    <input type="text" id="modelo-roteador-fibra" name="modelo-roteador-fibra">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="obs-fibra">Observações <span style="font-weight:400;color:#64748b">(Opcional)</span></label>
                    <textarea id="obs-fibra" name="obs-fibra" rows="3"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarBloco1Fibra(this)">📋 De/Para + Dados Técnicos</button>
                    <button class="btn-clear" onclick="limparFibra()">🗑️ Limpar</button>
                </div>
                <div class="btn-group" style="margin-top:8px">
                    <button class="btn-copy" onclick="copiarBloco2Fibra(this)">📋 Renomeio ONU</button>
                    <button class="btn-copy" onclick="copiarNovoLoginFibra(this)">📋 Novo Login</button>
                    <button class="btn-copy" onclick="copiarBloco3Fibra(this)">📋 Dados Importados</button>
                </div>
            </div>

            <!-- Card Rádio -->
            <div class="card" id="card-radio" style="display:none">
                <p class="card-title">Troca de Titularidade — Rádio</p>

                <div class="field">
                    <label for="nome-antigo-radio">Nome Titular Antigo</label>
                    <input type="text" id="nome-antigo-radio" name="nome-antigo-radio">
                    <label for="os-antiga-radio">O.S. Antiga</label>
                    <input type="text" id="os-antiga-radio" name="os-antiga-radio">
                    <label for="contrato-antigo-radio">Contrato Antigo</label>
                    <input type="text" id="contrato-antigo-radio" name="contrato-antigo-radio">
                </div>

                <div class="field">
                    <label for="nome-novo-radio">Nome Titular Novo</label>
                    <input type="text" id="nome-novo-radio" name="nome-novo-radio">
                    <label for="os-nova-radio">O.S. Nova</label>
                    <input type="text" id="os-nova-radio" name="os-nova-radio">
                    <label for="contrato-novo-radio">Contrato Novo</label>
                    <input type="text" id="contrato-novo-radio" name="contrato-novo-radio">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="endereco-radio">Endereço</label>
                    <input type="text" id="endereco-radio" name="endereco-radio">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="pppoe-antigo-radio">Usuário PPPoE Antigo</label>
                    <input type="text" id="pppoe-antigo-radio" name="pppoe-antigo-radio">
                    <label for="pppoe-senha-radio">Senha PPPoE</label>
                    <input type="text" id="pppoe-senha-radio" name="pppoe-senha-radio">
                    <label for="id-login-radio">ID Login Novo</label>
                    <input type="text" id="id-login-radio" name="id-login-radio">
                </div>

                <div class="field">
                    <label class="field-subtitle">Tipo de IP</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="tipo-ip-radio" value="NAT"  onchange="toggleIpRadio(this.value)"><span>NAT</span></label>
                        <label class="radio-btn"><input type="radio" name="tipo-ip-radio" value="FIXO" onchange="toggleIpRadio(this.value)"><span>IP Fixo</span></label>
                    </div>
                </div>
                <div class="field">
                    <label for="ip-radio">IP <span style="font-weight:400;color:#64748b">(Opcional se NAT)</span></label>
                    <input type="text" id="ip-radio" name="ip-radio">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="ip-base">IP BASE</label>
                    <input type="text" id="ip-base" name="ip-base">
                    <label for="ip-radio-cliente">IP Rádio Cliente</label>
                    <input type="text" id="ip-radio-cliente" name="ip-radio-cliente">
                    <label for="modelo-radio">Modelo Rádio Cliente</label>
                    <input type="text" id="modelo-radio" name="modelo-radio">
                    <label for="mac-radio">MAC Rádio Cliente</label>
                    <input type="text" id="mac-radio" name="mac-radio">
                    <label for="nome-radio">Nome do Rádio</label>
                    <input type="text" id="nome-radio" name="nome-radio">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="mac-roteador-radio">MAC Roteador (WAN)</label>
                    <input type="text" id="mac-roteador-radio" name="mac-roteador-radio">
                    <label for="modelo-roteador-radio">Modelo Roteador</label>
                    <input type="text" id="modelo-roteador-radio" name="modelo-roteador-radio">
                </div>

                <hr class="sep">

                <div class="field">
                    <label for="obs-radio">Observações <span style="font-weight:400;color:#64748b">(Opcional)</span></label>
                    <textarea id="obs-radio" name="obs-radio" rows="3"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarBloco1Radio(this)">📋 De/Para + Dados Técnicos</button>
                    <button class="btn-clear" onclick="limparRadio()">🗑️ Limpar</button>
                </div>
                <div class="btn-group" style="margin-top:8px">
                    <button class="btn-copy" onclick="copiarBloco2Radio(this)">📋 Renomeio Rádio</button>
                    <button class="btn-copy" onclick="copiarNovoLoginRadio(this)">📋 Novo Login</button>
                </div>
            </div>

            <div class="card">
                <div class="watermark">Desenvolvido por Pietro de Alexandria Picoli — <a href="https://github.com/PietroAlexandria" target="_blank" rel="noopener noreferrer">GitHub</a></div>
            </div>
        </div>

        <div class="history-container minimized" id="sidebar-panel">
            <div class="panel-tabs">
                <button class="panel-tab-btn" onclick="openPanel('historico')" title="Histórico" aria-label="Abrir Histórico">📋</button>
                <button class="panel-tab-btn" onclick="openPanel('notepad')" title="Bloco de Notas" aria-label="Abrir Bloco de Notas">📝</button>
                <button class="panel-tab-btn" onclick="openPanel('templates')" title="Templates" aria-label="Abrir Templates">💬</button>
            </div>
            <div class="history-header">
                <span id="panel-title">📋 Histórico</span>
                <div style="display:flex;align-items:center;gap:6px">
                    <button id="history-minimize-btn" class="history-minimize-btn" onclick="closePanel()" title="Fechar painel" aria-label="Fechar painel">▶</button>
                    <button id="btn-limpar-historico" onclick="limparHistorico()">Limpar tudo</button>
                    <button id="btn-copiar-notepad" onclick="copiarNotepad()" style="display:none">📋 Copiar</button>
                    <button id="btn-limpar-notepad" onclick="limparNotepad()" style="display:none">Limpar</button>
                </div>
            </div>
            <div class="history-content">
                <div id="history-module" style="display:none"><div id="history-panel"></div></div>
                <div id="notepad-module" style="display:none">
                    <textarea id="notepad-textarea" class="notepad-textarea" aria-label="Anotações rápidas" placeholder="Anotações rápidas…"></textarea>
                </div>
                <div id="templates-module" style="display:none">
                    <button class="template-btn" onclick="copyMudancaEnderecoCompleta(this)">📦 MUDANÇA DE ENDEREÇO</button>
                    <button class="template-btn" onclick="copyReboot(this)">🔄 REBOOT</button>
                    <button class="template-btn" onclick="copyPatchCordService(this)">🔌 PATCH CORD SERVICE</button>
                    <button class="template-btn" onclick="copyPatchCordBridge(this)">🔌 PATCH CORD BRIDGE</button>
                    <button class="template-btn" onclick="copyPatchCordRadio(this)">🔌 PATCH CORD RADIO</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/js/sharedFunctions/functionDarkMode.js"></script>
    <script src="/js/sharedFunctions/functionButtonsCopy.js"></script>
    <script src="/js/sharedFunctions/functionMostrarAlerta.js"></script>
    <script src="/js/sharedFunctions/functionToggleCards.js"></script>
    <script src="/js/n2/troca-titularidade.js"></script>
    <script src="/js/sharedFunctions/functionCardHistory.js"></script>
    <script>
        (async function () {
            const token = localStorage.getItem('n2-token');
            if (!token) { window.location.replace('/login-n2'); return; }
            try {
                const r = await fetch('/api/auth/n2/verify', {
                    method: 'POST',
                    headers: { 'x-n2-token': token }
                });
                if (!r.ok) {
                    localStorage.removeItem('n2-token');
                    window.location.replace('/login-n2');
                }
            } catch {
                window.location.replace('/login-n2');
            }
        })();
    </script>
</body>
</html>
