<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamentos - CedNet Helpdesk</title>
    <link rel="icon" href="/images/LogoCedNet.ico">
    <link rel="stylesheet" href="/css/pagamento.css">
    <link rel="stylesheet" href="/css/sharedCss/darkMode.css">
    <link rel="stylesheet" href="/css/sharedCss/historicoCard.css">
    <link rel="stylesheet" href="/css/sharedCss/btnCopyAx.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <button id="btn-dark-mode" class="btn-dark-mode" onclick="toggleDarkMode()" title="Alternar tema">🌙</button>
    <div class="layout-with-history">
        <div class="container">

            <div class="page-header">
                <a href="/" class="btn-back">← Voltar</a>
                <h1 class="page-title">💲 Pagamentos</h1>
            </div>

            <!-- Coleta de Dados -->
            <div class="card">
                <p class="card-title">Coleta de Dados</p>

                <div class="field">
                    <label class="field-subtitle">Via de Contato</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="via" value="Central"><span>Central</span></label>
                        <label class="radio-btn"><input type="radio" name="via" value="OPA"><span>OPA! Suite</span></label>
                    </div>
                </div>

                <hr class="sep">

                <div class="field">
                    <label>Nome</label>
                    <input type="text" name="nome" id="nome" placeholder="Ex: Pietro de Alexandria Picoli">
                </div>

                <div class="field">
                    <label>Contato</label>
                    <input type="text" name="contato" placeholder="Ex: (XX) XXXXX-XXXX" maxlength="15" oninput="mascaraContato(this)">
                </div>
            </div>

            <!-- Tipo de Atendimento -->
            <div class="card">
                <p class="card-title">Selecione o TIPO de atendimento</p>
                <div class="field">
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="type" value="Comprovante" onchange="toggleCards(this.value, { Comprovante: 'card-comprovante', SegundaVia: 'card-2via' })"><span>Comprovante</span></label>
                        <label class="radio-btn"><input type="radio" name="type" value="SegundaVia"  onchange="toggleCards(this.value, { Comprovante: 'card-comprovante', SegundaVia: 'card-2via' })"><span>2ª Via</span></label>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarColetaDados(this)">📋 Copiar Coleta</button>
                    <button class="btn-clear" onclick="limparColeta()">🗑️ Limpar</button>
                </div>
            </div>

            <!-- Card Comprovante -->
            <div class="card" id="card-comprovante" style="display:none">
                <p class="card-title">Comprovante de Pagamento</p>

                <div class="field">
                    <label>Forma de pagamento</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="formaPag" id="formaPag" value="pix"><span>PIX</span></label>
                        <label class="radio-btn"><input type="radio" name="formaPag" id="formaPag" value="boleto"><span>BOLETO</span></label>
                    </div>
                </div>

                <div class="field">
                    <label>Pagamento consta no sistema?</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="constar" id="constar" value="consta"><span>Consta</span></label>
                        <label class="radio-btn"><input type="radio" name="constar" id="constar" value="constaNao"><span>Não Consta</span></label>
                    </div>
                </div>

                <div class="field">
                    <label>Comprovante anexado?</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="anexar" id="anexado" value="anexadoSim"><span>Anexado</span></label>
                        <label class="radio-btn"><input type="radio" name="anexar" id="anexadoNao" value="anexadoNao"><span>Não Anexado</span></label>
                    </div>
                </div>

                <div class="field">
                    <label>Observação</label>
                    <textarea name="obs-comp" placeholder="Ex: Cliente solicitou comprovante do pagamento de Junho/2025."></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarComprovante(this)">📋 Copiar Comprovante</button>
                    <button class="btn-clear" onclick="limparComprovante()">🗑️ Limpar</button>
                </div>
            </div>

            <!-- Card 2ª Via -->
            <div class="card" id="card-2via" style="display:none">
                <p class="card-title">2ª Via de Boleto</p>


                <div class="field">
                    <label>Forma de Pagamento</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="formaPag-2via" id="formaPag-2via" value="viaPix"><span>PIX</span></label>
                        <label class="radio-btn"><input type="radio" name="formaPag-2via" id="formaPag-2via" value="viaBoleto"><span>BOLETO</span></label>
                    </div>
                </div>

                <div class="field">
                    <label>Observação</label>
                    <textarea name="obs-2via" placeholder="Ex: Cliente solicitou 2ª via do boleto de Junho/2025."></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiar2Via(this)">📋 Copiar 2ª Via</button>
                    <button class="btn-clear" onclick="limpar2Via()">🗑️ Limpar</button>
                </div>
            </div>

            <!-- Watermark -->
            <div class="card">
                <div class="watermark">Desenvolvido por Pietro de Alexandria Picoli — <a href="https://github.com/PietroAlexandria" target="_blank">GitHub</a></div>
            </div>
        </div>

        <div class="history-container minimized" id="sidebar-panel">
            <div class="panel-tabs">
                <button class="panel-tab-btn" onclick="openPanel('historico')" title="Histórico">📋</button>
                <button class="panel-tab-btn" onclick="openPanel('notepad')" title="Bloco de Notas">📝</button>
            </div>
            <div class="history-header">
                <span id="panel-title">📋 Histórico</span>
                <div style="display:flex;align-items:center;gap:6px">
                    <button id="history-minimize-btn" class="history-minimize-btn" onclick="closePanel()" title="Fechar painel">▶</button>
                    <button id="btn-limpar-historico" onclick="limparHistorico()">Limpar tudo</button>
                    <button id="btn-copiar-notepad" onclick="copiarNotepad()" style="display:none">📋 Copiar</button>
                    <button id="btn-limpar-notepad" onclick="limparNotepad()" style="display:none">Limpar</button>
                </div>
            </div>
            <div class="history-content">
                <div id="history-module" style="display:none">
                    <div id="history-panel"></div>
                </div>
                <div id="notepad-module" style="display:none">
                    <textarea id="notepad-textarea" class="notepad-textarea" placeholder="Anotações rápidas..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/sharedFunctions/functionDarkMode.js"      ></script>
    <script src="/js/sharedFunctions/functionMostrarAlerta.js" ></script>
    <script src="/js/sharedFunctions/functionToggleCards.js"   ></script>
    <script src="/js/sharedFunctions/functionContact.js"       ></script>
    <script src="/js/sharedFunctions/functionCopyName.js"      ></script>
    <script src="/js/sharedFunctions/functionButtonsCopy.js"   ></script>
    <script src="/js/options-js/pagamento.js"                  ></script>
    <script src="/js/sharedFunctions/functionCardHistory.js"   ></script>
</body>
</html>
