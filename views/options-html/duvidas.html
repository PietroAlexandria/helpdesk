<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dúvidas - CedNet Helpdesk</title>
    <link rel="icon" href="/images/LogoCedNet.ico">
    <link rel="stylesheet" href="/css/duvidas.css">
    <link rel="stylesheet" href="/css/sharedCss/darkMode.css">
    <link rel="stylesheet" href="/css/sharedCss/historicoCard.css">
    <link rel="stylesheet" href="/css/sharedCss/btnCopyAx.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <button id="btn-dark-mode" class="btn-dark-mode" onclick="toggleDarkMode()" title="Alternar tema">🌙</button>
    <div class="layout-with-history">
        <div class="container">

            <div class="page-header">
                <a href="/" class="btn-back">← Voltar</a>
                <h1 class="page-title">❓ Dúvidas</h1>
            </div>

            <!-- Coleta de Dados -->
            <div class="card">
                <p class="card-title">Coleta de Dados</p>

                <div class="field">
                    <label class="field-subtitle">Via de Contato</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="via" value="Central"><span>Central</span></label>
                        <label class="radio-btn"><input type="radio" name="via" value="OPA"><span>OPA! Suite</span></label>
                    </div>
                </div>

                <hr class="sep">

                <div class="field">
                    <label>Nome</label>
                    <input type="text" name="nome" id="nome" placeholder="Ex: Pietro de Alexandria Picoli">
                </div>

                <div class="field">
                    <label>Contato</label>
                    <input type="text" name="contato" placeholder="Ex: (XX) XXXXX-XXXX" maxlength="15" oninput="mascaraContato(this)">
                </div>
            </div>

            <!-- Tipo de Dúvida -->
            <div class="card">
                <p class="card-title">Selecione o TIPO de dúvida</p>
                <div class="field">
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="type" value="Suporte"    onchange="toggleCards(this.value, { Suporte: 'card-suporte', Financeiro: 'card-financeiro', Comercial: 'card-comercial', Previsao: 'card-previsao' })"><span>Dúvidas - Suporte</span></label>
                        <label class="radio-btn"><input type="radio" name="type" value="Financeiro" onchange="toggleCards(this.value, { Suporte: 'card-suporte', Financeiro: 'card-financeiro', Comercial: 'card-comercial', Previsao: 'card-previsao' })"><span>Dúvidas Financeiras</span></label>
                        <label class="radio-btn"><input type="radio" name="type" value="Comercial"  onchange="toggleCards(this.value, { Suporte: 'card-suporte', Financeiro: 'card-financeiro', Comercial: 'card-comercial', Previsao: 'card-previsao' })"><span>Dúvidas Comercial</span></label>
                        <label class="radio-btn"><input type="radio" name="type" value="Previsao"   onchange="toggleCards(this.value, { Suporte: 'card-suporte', Financeiro: 'card-financeiro', Comercial: 'card-comercial', Previsao: 'card-previsao' })"><span>Previsão</span></label>
                    </div>
                </div>
            </div>

            <!-- Card Suporte -->
            <div class="card" id="card-suporte" style="display:none">
                <p class="card-title">Dúvidas - Suporte</p>

                <div class="field">
                    <label>Descrição do Ocorrido</label>
                    <textarea name="desc-suporte" placeholder="Ex: Cliente com dúvida sobre acesso via IP"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarDuvida('suporte', this)">📋 Copiar</button>
                    <button class="btn-clear" onclick="limparCard('suporte')">🗑️ Limpar</button>
                </div> <br>

                <div class="field">
                    <label>Deseja retornar contato?</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarSim" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sim</span></label>
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarNao" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sem necessidade</span></label>
                    </div>
                </div>
            </div>

            <!-- Card Financeiro -->
            <div class="card" id="card-financeiro" style="display:none">
                <p class="card-title">Dúvidas Financeiras</p>

                <div class="field">
                    <label>Descrição do Ocorrido</label>
                    <textarea name="desc-financeiro" placeholder="Ex: Cliente com dúvidas sobre o valor da fatura"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarDuvida('financeiro', this)">📋 Copiar</button>
                    <button class="btn-clear" onclick="limparCard('financeiro')">🗑️ Limpar</button>
                </div> <br>

                <div class="field">
                    <label>Deseja retornar contato?</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarSim" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sim</span></label>
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarNao" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sem necessidade</span></label>
                    </div>
                </div>
            </div>

            <!-- Card Comercial -->
            <div class="card" id="card-comercial" style="display:none">
                <p class="card-title">Dúvidas Comercial</p>

                <div class="field">
                    <label>Descrição do Ocorrido</label>
                    <textarea name="desc-comercial" placeholder="Ex: Cliente com dúvidas sobre planos disponíveis na região"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarDuvida('comercial', this)">📋 Copiar</button>
                    <button class="btn-clear" onclick="limparCard('comercial')">🗑️ Limpar</button>
                </div> <br>

                <div class="field">
                    <label>Deseja retornar contato?</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarSim" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sim</span></label>
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarNao" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sem necessidade</span></label>
                    </div>
                </div>
            </div>

            <!-- Card Previsao -->
            <div class="card" id="card-previsao" style="display:none">
                <p class="card-title">Previsão</p>

                <div class="field">
                    <label>Descrição do Ocorrido</label>
                    <textarea name="desc-previsao" placeholder="Ex: Verificado com setor de Agendamento e realizarão hoje ao decorrer da tarde"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarDuvida('previsao', this)">📋 Copiar</button>
                    <button class="btn-clear" onclick="limparCard('previsao')">🗑️ Limpar</button>
                </div> <br>

                <div class="field">
                    <label>Deseja retornar contato?</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarSim" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sim</span></label>
                        <label class="radio-btn"><input type="radio" name="retornar" value="retornarNao" onchange="toggleCards(this.value, { retornarSim: 'card-contato', retornarNao: '' })"><span>Sem necessidade</span></label>
                    </div>
                </div>
            </div>

            <!-- Card Retornar Ctt -->
            <div class="card" id="card-contato" style="display:none">
                <div class="field">
                    <label>Protocolo</label>
                    <input type="text" name="protocolo" id="protocolo" placeholder="Ex: 202608178180">
                </div>

                <div class="field">
                    <label class="field-subtitle">Disponibilidade</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="disponibilidade-agendamento" value="manha" onchange="horarioEspecifico(this)"><span>Manhã</span></label>
                        <label class="radio-btn"><input type="radio" name="disponibilidade-agendamento" value="tarde" onchange="horarioEspecifico(this)"><span>Tarde</span></label>
                        <label class="radio-btn"><input type="radio" name="disponibilidade-agendamento" value="qualquerHoraio" onchange="horarioEspecifico(this)"><span>Qualquer Horário</span></label>
                        <label class="radio-btn"><input type="radio" name="disponibilidade-agendamento" value="horario-especifico" onchange="horarioEspecifico(this)"><span>Horário Específico</span></label>
                    </div>
                </div>

                <div class="field" id="horario-especifico-agendamento" style="display:none">
                    <label class="field-subtitle">Horário Específico</label>
                    <div>
                        <textarea name="horarioEsp" placeholder="Ex: 10h às 12h"></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-copy" onclick="copiarRetornoContato(this)">📋 Copiar</button>
                    <button class="btn-clear" onclick="limparCard(this)">🗑️ Limpar</button>
                </div>
            </div>

            <!-- Watermark -->
            <div class="card">
                <div class="watermark">Desenvolvido por Pietro de Alexandria Picoli — <a href="https://github.com/PietroAlexandria" target="_blank">GitHub</a></div>
            </div>
        </div>

        <div class="history-container minimized" id="sidebar-panel">
            <div class="panel-tabs">
                <button class="panel-tab-btn" onclick="openPanel('historico')" title="Histórico">📋</button>
                <button class="panel-tab-btn" onclick="openPanel('notepad')" title="Bloco de Notas">📝</button>
            </div>
            <div class="history-header">
                <span id="panel-title">📋 Histórico</span>
                <div style="display:flex;align-items:center;gap:6px">
                    <button id="history-minimize-btn" class="history-minimize-btn" onclick="closePanel()" title="Fechar painel">▶</button>
                    <button id="btn-limpar-historico" onclick="limparHistorico()">Limpar tudo</button>
                    <button id="btn-copiar-notepad" onclick="copiarNotepad()" style="display:none">📋 Copiar</button>
                    <button id="btn-limpar-notepad" onclick="limparNotepad()" style="display:none">Limpar</button>
                </div>
            </div>
            <div class="history-content">
                <div id="history-module" style="display:none">
                    <div id="history-panel"></div>
                </div>
                <div id="notepad-module" style="display:none">
                    <textarea id="notepad-textarea" class="notepad-textarea" placeholder="Anotações rápidas..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        function horarioEspecifico(el) {
            const idMap = {
                'disponibilidade-agendamento': 'horario-especifico-agendamento',
                'disponibilidade-agendamento-radio': 'horario-especifico-agendamento-radio'
            };
            const targetId = idMap[el.name];
            if (!targetId) return;
            document.getElementById(targetId).style.display = el.value === 'horario-especifico' ? 'block' : 'none';
        }
    </script>
    <script src="/js/sharedFunctions/functionDarkMode.js"      ></script>
    <script src="/js/sharedFunctions/functionMostrarAlerta.js" ></script>
    <script src="/js/sharedFunctions/functionToggleCards.js"   ></script>
    <script src="/js/sharedFunctions/functionContact.js"       ></script>
    <script src="/js/sharedFunctions/functionCopyName.js"      ></script>
    <script src="/js/sharedFunctions/functionButtonsCopy.js"   ></script>
    <script src="/js/options-js/duvidas.js"                    ></script>
    <script src="/js/sharedFunctions/functionPreencherColeta.js"></script>
    <script src="/js/sharedFunctions/functionCardHistory.js"   ></script>
</body>
</html>
